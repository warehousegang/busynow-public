  <rect x="80" y="824" width="1640" height="232" rx="24" fill="white" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="120" y="876" class="cardTitle">What this diagram is showing</text>
  <text x="120" y="912" class="body">BusyNow serves the frontend and API through the same public domain, but CloudFront explicitly separates the paths. Normal frontend routes stay on the S3 origin and SPA fallback path.</text>
  <text x="120" y="940" class="body">Protected API behaviors send `/places/*`, `/api/places/*`, `/status*`, `/api/status*`, `/checkin*`, and `/api/checkin*` to the ALB origin, which only forwards approved paths when the internal header matches.</text>
  <text x="120" y="968" class="body">Browser-facing `/places/*` is intentionally shaped by WAF Bot Control because nearby search can trigger paid Google Places traffic. CLI and scripted verification traffic should prefer `/api/places/*`.</text>
  <text x="120" y="996" class="body">Redis is used only for ephemeral 30 minute duplicate check-in suppression across ECS tasks. It is not the system of record, not a general response cache, and not an auth or session layer.</text>

  <line x1="1150" y1="896" x2="1204" y2="896" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrowPrimary)"/>
  <text x="1224" y="901" class="legend">Primary request flow</text>
  <line x1="1150" y1="934" x2="1204" y2="934" stroke="#FF9900" stroke-width="2.4" stroke-dasharray="6 7" marker-end="url(#arrowAccent)"/>
  <text x="1224" y="939" class="legend">Policy or protection behavior</text>
  <line x1="1150" y1="972" x2="1204" y2="972" stroke="#64748B" stroke-width="2.2" stroke-dasharray="4 7" marker-end="url(#arrowMuted)"/>
  <text x="1224" y="977" class="legend">Blocked or constrained path</text>
