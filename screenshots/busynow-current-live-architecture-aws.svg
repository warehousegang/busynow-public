  <text x="900" y="56" text-anchor="middle" class="title">BusyNow - Current Live Architecture (AWS)</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">Current public path with explicit CloudFront API routing, WAF-protected browser search, Redis-backed check-in dedupe, and graceful degradation</text>

